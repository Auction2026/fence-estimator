version: "3.9"

name: fence-estimator

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fence-estimator-app
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/fence-estimator
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: http://localhost:8080
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-demo@example.com}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-demo-password}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-replace-me}
      REPORTING_DATABASE_URL: ******db:5432/fence_reporting
    depends_on:
      mongo:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/public:ro
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: fence-estimator-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: fence-estimator
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://127.0.0.1:27017/fence-estimator", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: fence-estimator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fence_reporting
      POSTGRES_USER: fence
      POSTGRES_PASSWORD: fence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fence -d fence_reporting"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: nginx:1.27-alpine
    container_name: fence-estimator-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  postgres_data:
  app_logs:
