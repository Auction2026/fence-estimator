version: '3.9'
services:
  backend:
    build: .
    working_dir: /app/backend
    ports:
      - '5000:5000'
    env_file:
      - .env
    depends_on:
      - mongo
  frontend:
    image: python:3.12-slim
    working_dir: /workspace
    command: python3 -m http.server 4173 --directory /workspace/frontend
    volumes:
      - .:/workspace
    ports:
      - '4173:4173'
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

volumes:
  mongo_data:
